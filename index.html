<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Dioramas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 24% 20%,
            rgba(255, 216, 176, 0.9) 0%,
            rgba(255, 216, 176, 0) 34%
          ),
          radial-gradient(
            circle at 78% 24%,
            rgba(255, 230, 166, 0.68) 0%,
            rgba(255, 230, 166, 0) 28%
          ),
          linear-gradient(180deg, #f4efe7 0%, #f2e1cb 52%, #eed4aa 100%);
      }
      body.is-interactive-hover,
      body.is-interactive-hover canvas {
        cursor: pointer;
      }
      .polaroid-layer,
      .petal-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .polaroid-layer {
        z-index: 4;
      }
      .petal-layer {
        z-index: 5;
      }
      canvas {
        position: relative;
        z-index: 1;
        display: block;
        filter: saturate(1.14) brightness(0.93) contrast(1.04);
      }
      .petal {
        position: absolute;
        top: -12vh;
        width: 12px;
        height: 10px;
        background: linear-gradient(
          145deg,
          rgba(244, 214, 218, 0.84) 0%,
          rgba(233, 187, 196, 0.82) 58%,
          rgba(214, 166, 176, 0.8) 100%
        );
        clip-path: polygon(
          52% 0%,
          78% 18%,
          100% 52%,
          76% 88%,
          46% 100%,
          20% 82%,
          0% 48%,
          24% 16%
        );
        box-shadow: 0 1px 0 rgba(255, 245, 245, 0.18);
        opacity: 0.5;
        transform: rotate(18deg);
        mix-blend-mode: multiply;
        animation-name: petalFall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      .petal::after {
        content: "";
        position: absolute;
        inset: 22% 26% 26% 22%;
        clip-path: polygon(
          16% 50%,
          40% 14%,
          74% 26%,
          86% 56%,
          60% 84%,
          28% 76%
        );
        background: rgba(255, 240, 240, 0.22);
        transform: rotate(-12deg);
      }
      @keyframes petalFall {
        0% {
          transform: translate3d(0, -10vh, 0) rotate(0deg) scale(0.9);
          opacity: 0;
        }
        12% {
          opacity: 0.45;
        }
        50% {
          transform: translate3d(2.4vw, 48vh, 0) rotate(110deg) scale(0.96);
          opacity: 0.52;
        }
        100% {
          transform: translate3d(-3.8vw, 112vh, 0) rotate(220deg) scale(0.9);
          opacity: 0;
        }
      }
      .polaroid-tray {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }
      .polaroid-tray.is-visible {
        opacity: 1;
        pointer-events: auto;
      }
      .polaroid {
        position: absolute;
        width: var(--card-width, 246px);
        height: var(--card-height, 296px);
        transform-origin: center bottom;
        transition: opacity 240ms ease;
        transition-delay: var(--delay, 0ms);
        opacity: 0;
        perspective: 1200px;
        pointer-events: auto;
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      .polaroid.is-dragging {
        cursor: grabbing;
      }
      .polaroid-tray.is-visible .polaroid {
        opacity: 1;
        animation: polaroidPop 560ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        animation-delay: var(--delay, 0ms);
      }
      .polaroid-face {
        position: absolute;
        inset: 0;
        padding: 12px;
        background: #fffdf9;
        border-radius: 4px;
        box-shadow: 0 22px 44px rgba(77, 59, 40, 0.24);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .polaroid-photo {
        width: 100%;
        height: 100%;
        border-radius: 1px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.22),
            rgba(255, 255, 255, 0)
          ),
          var(--photo, linear-gradient(135deg, #d8d8d8, #b2b2b2));
        background-size: cover;
        background-position: center;
      }
      @keyframes polaroidPop {
        0% {
          transform: translateY(180px) rotate(var(--start-angle, 0deg))
            scale(0.96);
        }
        65% {
          transform: translateY(-8px) rotate(var(--overshoot-angle, 0deg))
            scale(1.01);
        }
        100% {
          transform: translateY(0) rotate(var(--settle-angle, 0deg)) scale(1);
        }
      }
    </style>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="view-gallery">
    <main class="gallery" id="gallery" aria-label="Your cities">
      <div class="gallery-viewport" id="gallery-viewport">
        <div class="gallery-track" id="gallery-track"></div>
      </div>
      <button class="gallery-arrow gallery-arrow--prev" id="gallery-prev" type="button" aria-label="Previous city">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="gallery-arrow gallery-arrow--next" id="gallery-next" type="button" aria-label="Next city">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>
      <div class="gallery-dots" id="gallery-dots"></div>
      <div class="gallery-actions">
        <button class="trip-button" id="trip-button" type="button">Try with my trip</button>
        <button class="upload-link" id="upload-link" type="button">Or upload your own</button>
        <input class="upload-input" id="upload-input" type="file" accept="image/*" multiple />
      </div>
    </main>
    <button class="back-button" id="back-button" type="button">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      All cities
    </button>
    <div class="polaroid-layer" id="polaroid-layer"></div>
    <div class="petal-layer" id="petal-layer"></div>
    <div class="notice-layer" id="notice-layer"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
    <script src="cities.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/notice.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/polaroids.js"></script>
    <script src="js/map.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
